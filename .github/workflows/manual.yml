name: Run Telegram Bot

on:
  workflow_dispatch: # Agar bisa dijalankan manual lewat tombol
  schedule:
    - cron: '0 */5 * * *' # Otomatis restart setiap 5 jam (karena limit GitHub 6 jam)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Jalankan Bot
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python auto_tg.py
